services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: cicd-calculator:latest
    container_name: calculator_api
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 15s
      timeout: 5s
      retries: 3
